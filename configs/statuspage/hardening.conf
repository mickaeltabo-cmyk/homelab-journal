[Service]
# Interdit de gagner des droits en cours de route (sudo, binaires setuid)
NoNewPrivileges=yes
# Donne au service son propre /tmp, invisible des autres comptes
PrivateTmp=yes
# Met tout le système de fichiers en lecture seule pour ce service
ProtectSystem=strict
# Interdit l'accès à /home, /root et /run/user
ProtectHome=yes
# Interdit de modifier les réglages du noyau (/proc/sys, /sys)
ProtectKernelTunables=yes
# Interdit de charger des modules dans le noyau
ProtectKernelModules=yes
# Interdit de lire les logs du noyau (dmesg)
ProtectKernelLogs=yes
# Interdit de modifier les cgroups (limites de ressources)
ProtectControlGroups=yes
# Interdit de changer l'horloge du système
ProtectClock=yes
# Interdit de changer le nom de la machine
ProtectHostname=yes
# Cache les vrais périphériques : le service ne voit qu'un /dev minimal
PrivateDevices=yes
# Interdit de créer des fichiers setuid/setgid
RestrictSUIDSGID=yes
# Nettoie les objets IPC du compte quand le service s'arrête (la ligne ✗ de ta première capture)
RemoveIPC=yes
