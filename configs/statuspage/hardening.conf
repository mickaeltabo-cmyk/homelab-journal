[Service]
# Interdit au service d'acquérir de nouveaux privilèges
NoNewPrivileges=yes
# Monte tout le système de fichiers en lecture seule pour le service
ProtectSystem=strict
# Rend /home et /root inaccessibles
ProtectHome=yes
# Isole /tmp dans un espace privé
PrivateTmp=yes
# Retire l'accès aux périphériques physiques
PrivateDevices=yes
# Protège les paramètres noyau, modules et cgroups
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
